<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EaglercraftX Launcher</title>
<style>
  :root {
    --bg:      #1e1e2e;
    --mantle:  #181825;
    --surface: #313244;
    --overlay: #45475a;
    --text:    #cdd6f4;
    --subtext: #6c7086;
    --green:   #a6e3a1;
    --blue:    #89b4fa;
    --red:     #f38ba8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--mantle); padding: 16px 24px; display: flex; align-items: center;
           gap: 14px; border-bottom: 1px solid var(--overlay); }
  header h1 { font-size: 20px; color: var(--green); }
  header span { font-size: 11px; color: var(--subtext); margin-left: auto; }

  main { display: flex; flex: 1; overflow: hidden; }

  aside { width: 270px; min-width: 270px; padding: 16px; display: flex; flex-direction: column;
          gap: 14px; border-right: 1px solid var(--overlay); background: var(--mantle); }

  .cap { font-size: 10px; font-weight: 700; color: var(--subtext); letter-spacing: .08em;
         text-transform: uppercase; display: block; margin-bottom: 4px; }

  input[type=text] {
    width: 100%; padding: 8px 10px; background: var(--surface); border: none; border-radius: 6px;
    color: var(--text); font-size: 13px; outline: none;
  }
  input[type=text]:focus { box-shadow: 0 0 0 2px var(--blue); }

  #play-btn {
    padding: 11px; border: none; border-radius: 8px; cursor: pointer;
    background: var(--green); color: var(--mantle); font-size: 15px; font-weight: 700;
    transition: opacity .15s; width: 100%;
  }
  #play-btn:hover { opacity: .85; }
  #play-btn:disabled { opacity: .4; cursor: default; }

  .right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid var(--overlay); background: var(--mantle); }
  .tab { padding: 10px 20px; font-size: 12px; font-weight: 600; cursor: pointer;
         color: var(--subtext); border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  .tab-panel { flex: 1; overflow-y: auto; display: none; padding: 16px; }
  .tab-panel.active { display: block; }

  .server-card {
    background: var(--surface); border-radius: 8px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; cursor: pointer; border: 2px solid transparent; transition: border-color .15s;
  }
  .server-card:hover { border-color: var(--overlay); }
  .server-card.selected { border-color: var(--green); }
  .server-name { font-size: 14px; font-weight: 600; }
  .server-addr { font-size: 11px; color: var(--subtext); margin-top: 2px; }

  .add-server { display: flex; gap: 8px; margin-top: 8px; }
  .add-server input { flex: 1; }
  .btn-add { padding: 8px 14px; background: var(--blue); color: var(--mantle);
             border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-del { padding: 4px 10px; background: var(--surface); color: var(--red);
             border: 1px solid var(--overlay); border-radius: 6px; font-size: 11px; cursor: pointer; }

  #play-hint { font-size: 11px; color: var(--subtext); text-align: center; }
  #selected-display { font-size: 13px; color: var(--subtext); padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>⛏ EaglercraftX Launcher</h1>
  <span>1.8.8</span>
</header>
<main>
  <aside>
    <div>
      <span class="cap">Username</span>
      <input id="username" type="text" placeholder="Player" maxlength="16">
    </div>
    <div>
      <span class="cap">Selected Server</span>
      <div id="selected-display">None</div>
    </div>
    <button id="play-btn" onclick="play()" disabled>▶ &nbsp; PLAY</button>
    <div id="play-hint">Select a server first</div>
  </aside>

  <div class="right">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('servers')">Servers</div>
      <div class="tab"        onclick="switchTab('news')">News</div>
    </div>
    <div class="tab-panel active" id="panel-servers">
      <div id="server-list"></div>
      <div class="add-server">
        <input id="new-name" type="text" placeholder="Name" style="max-width:120px;">
        <input id="new-addr" type="text" placeholder="Server address">
        <button class="btn-add" onclick="addServer()">+ Add</button>
      </div>
    </div>
    <div class="tab-panel" id="panel-news">
      <h3 style="color:var(--text);margin-bottom:10px;">EaglercraftX 1.8</h3>
      <p style="color:var(--subtext);font-size:13px;line-height:1.6;">
        Play Minecraft 1.8 in your browser — no download required.<br><br>
        Pick a server from the list, enter your username, and hit Play.
      </p>
    </div>
  </div>
</main>

<script>
const DEFAULT_SERVERS = [
  { name: "lax1dude Relay #1", addr: "wss://relay.deev.is/" },
  { name: "lax1dude Relay #2", addr: "wss://relay.lax1dude.net/" },
  { name: "ayunami Relay",     addr: "wss://relay.shhnowisnottheti.me/" },
];

let servers = [];
let selectedIdx = null;

function load() {
  try { servers = JSON.parse(localStorage.getItem('eagler_servers')) || DEFAULT_SERVERS; }
  catch { servers = DEFAULT_SERVERS; }
  const u = localStorage.getItem('eagler_username');
  if (u) document.getElementById('username').value = u;
  render();
}

function save() { localStorage.setItem('eagler_servers', JSON.stringify(servers)); }

function render() {
  const list = document.getElementById('server-list');
  list.innerHTML = servers.length ? servers.map((s, i) => `
    <div class="server-card ${selectedIdx === i ? 'selected' : ''}" onclick="select(${i})">
      <div>
        <div class="server-name">${s.name}</div>
        <div class="server-addr">${s.addr}</div>
      </div>
      <button class="btn-del" onclick="event.stopPropagation();del(${i})">✕</button>
    </div>`).join('') :
    '<div style="color:var(--subtext);font-size:13px;">No servers. Add one below.</div>';
}

function select(i) {
  selectedIdx = i;
  render();
  document.getElementById('selected-display').textContent = servers[i].name;
  document.getElementById('selected-display').style.color = 'var(--green)';
  document.getElementById('play-btn').disabled = false;
  document.getElementById('play-hint').textContent = 'Ready!';
}

function del(i) {
  servers.splice(i, 1);
  if (selectedIdx === i) { selectedIdx = null; document.getElementById('play-btn').disabled = true; document.getElementById('selected-display').textContent = 'None'; document.getElementById('selected-display').style.color = 'var(--subtext)'; }
  else if (selectedIdx > i) selectedIdx--;
  save(); render();
}

function addServer() {
  const name = document.getElementById('new-name').value.trim();
  const addr = document.getElementById('new-addr').value.trim();
  if (!addr) return;
  servers.push({ name: name || addr, addr });
  save(); render();
  document.getElementById('new-name').value = '';
  document.getElementById('new-addr').value = '';
}

function switchTab(name) {
  ['servers','news'].forEach((t, i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t === name);
    document.getElementById('panel-' + t).classList.toggle('active', t === name);
  });
}

function play() {
  const username = document.getElementById('username').value.trim() || 'Player';
  localStorage.setItem('eagler_username', username);
  const s = servers[selectedIdx];
  const params = new URLSearchParams({ username, server: s.addr });
  window.location.href = 'game.html?' + params.toString();
}

load();
</script>
</body>
</html>
